<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Goteo Mail</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="card narrow">
      <h1>Goteo Mail</h1>
      <p class="muted">Envíos de uno en uno, a ritmo de persona.</p>
      <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="primary">Entrar</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header>
      <strong>Goteo Mail</strong>
      <nav>
        <a href="#resumen" data-tab="resumen">Resumen</a>
        <a href="#campanas" data-tab="campanas">Campañas</a>
        <a href="#contactos" data-tab="contactos">Contactos</a>
        <a href="#buzones" data-tab="buzones">Buzones</a>
      </nav>
      <button id="logout" class="ghost small">Salir</button>
    </header>
    <main id="main"></main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
